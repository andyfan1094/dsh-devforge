packages:
  - .
# 仅批准 SSH 传输核心的原生构建；cpu-features 为可选优化，明确保持禁用。
allowBuilds:
  cpu-features: false
  # protobufjs（飞书 SDK 传递依赖）无原生模块，构建脚本仅可选优化，禁用。
  protobufjs: false
  ssh2: true
# MCP 接入（0.21.0）：dsh 官方包统一钉在与运行中宿主一致的 0.1.2-rc.1。
# 原因：npm 上较新的 dsh rc 版本内部依赖改用了尚未发布的稳定版区间（如 dsh-brand@^0.1.2），
# 直接解析会报 NO_MATCHING_VERSION；钉版镜像 /opt 宿主束，保证与宿主同源同版本。
# dsh-agent 保持 0.1.0-rc.8：feishu/index.mjs 运行时 import，不随本次变更升级。
# 全量显式钉版：pnpm 11 的通配符 overrides 对 peer 自动安装不生效，逐包钉到与宿主一致的 0.1.2-rc.1。
# dsh-agent 豁免（feishu/index.mjs 运行时 import，保持 0.1.0-rc.8）。
overrides:
  '@deepseek-ai/dsh-acp': 0.1.2-rc.1
  '@deepseek-ai/dsh-acp-app': 0.1.2-rc.1
  '@deepseek-ai/dsh-agent-default-model': 0.1.2-rc.1
